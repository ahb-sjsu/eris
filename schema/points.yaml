# Eris telemetry point schema, v0.1
# Formalized from yacht/data-model.txt (author's hand list, 2021-2025 era).
# Path convention follows Signal K where a standard path exists; custom paths
# are marked. Units are the wire units; display conversion is the dashboard's
# job. Engine/genset models deliberately unstated pending confirmation from
# the vessel (do not guess into this file).
#
# vessel: Eris, ex-USCG Point-class cutter, 82 ft
# sister-ship drawing set: USCGC Point Barnes (drawings/)
#
# plant (owner-confirmed 2026-08-30):
#   mains:   2x Cummins VT900M (milspec designation VT1710)
#   gensets: 2x Detroit Diesel 2-71, 20 kW, 3-phase, DELTA connected,
#            floating neutral, 440 V
#   note: delta + floating neutral means there is no line-to-neutral
#   quantity to measure; AC voltage channels are LINE-TO-LINE, and any
#   ground-referenced voltage measurement on this bus is meaningless by
#   design. Sensor selection must respect this.

defaults:
  sample_interval_s: 2
  history: victoriametrics
  transport: TBD   # candidates: NMEA2000 -> Signal K server -> VM remote-write

templates:
  diesel_common: &diesel_common
    fuelSolenoid:        {type: bool,  desc: fuel solenoid energized}
    fuelPressure:        {unit: Pa,    desc: fuel oil pressure}
    rawWaterInletTemp:   {unit: K,     desc: raw water inlet temp}
    rawWaterExhaustTemp: {unit: K,     desc: raw water temp at exhaust mixer}
    rawWaterPumpRpm:     {unit: rpm}
    rawWaterPressure:    {unit: Pa}
    freshWaterTemp:      {unit: K,     desc: jacket water temp}
    freshWaterPumpRpm:   {unit: rpm}
    freshWaterPressure:  {unit: Pa}
    lubeOilPressure:     {unit: Pa}
    rpm:                 {unit: rpm}
    alternatorVolts:     {unit: V}
    alternatorAmps:      {unit: A}
    hours:               {unit: h,     desc: running hours counter}

points:
  propulsion:
    port: &main_engine
      model: "Cummins VT900M (milspec VT1710)"
      <<: *diesel_common
      egt:
        left:  {unit: K, desc: exhaust gas temp, left bank}
        right: {unit: K, desc: exhaust gas temp, right bank}
      turboBoost:
        1: {unit: Pa}
        2: {unit: Pa}
      transmissionOilPressure: {unit: Pa, desc: Twin Disc gear oil pressure (HP9400/HP10500 manuals in docs/)}
      shaftRpm: {unit: rpm, desc: shaft tach after reduction}
    starboard: *main_engine

  electrical:
    generators:
      "1": &genset
        model: "Detroit Diesel 2-71"
        rating_kw: 20
        <<: *diesel_common
        # The hand list said "EGT R|L". A 2-71 is an inline two, no banks,
        # so these are read as PER-CYLINDER probes, one per cylinder.
        egt:
          cyl1: {unit: K}
          cyl2: {unit: K}
        # Delta, floating neutral: line-to-line only (see header note).
        acVoltsLineToLine: {unit: V, dims: [L1L2, L2L3, L3L1], nominal: 440}
        acAmpsPerLine:     {unit: A, dims: [L1, L2, L3]}
        frequency:         {unit: Hz}
      "2": *genset

  tanks:
    # capacities owner-confirmed 2026-08-30; plumbing topology (what feeds
    # what, transfer/polishing valve lineup) not yet recorded -- see
    # process/fuel_polishing_bpmn.xml for the polishing loop itself
    fuel:
      wingPort:      &tank
        capacity_gal: 920
        level:  {unit: ratio, desc: 0..1 of capacity}
        volume: {unit: gal,   desc: derived from level x capacity}
      wingStarboard:
        <<: *tank
        capacity_gal: 920
      day:
        <<: *tank
        capacity_gal: 186
    freshWater:
      main:
        <<: *tank
        capacity_gal: 1500

  ventilation:
    engineRoom:
      port: &er_fan
        amps:    {unit: A}
        rpm:     {unit: rpm}
        airflow: {unit: cfm, custom: true}
      starboard: *er_fan

# --- raw water topology (owner-confirmed 2026-08-30) ---
# Not telemetry points per se; the physical arrangement the points hang off.
topology:
  rawWater:
    seaChests:
      mainPort:      {serves: [propulsion.port],      strainers: duplex per consumer}
      mainStarboard: {serves: [propulsion.starboard], strainers: duplex per consumer}
      auxiliary:
        serves: [electrical.generators.1, electrical.generators.2, firePump]
        note: shared chest; each consumer has its own duplex strainer
    # candidate future channels, NOT yet sensed: strainer differential
    # pressure or vacuum per duplex basket -- the standard early-warning
    # for fouling. Decide per-consumer when specifying senders.

firePump:
  driver: electric
  suction: topology.rawWater.seaChests.auxiliary (own duplex strainer)
  stations:
    port:      {desc: hose attachment, adjacent to hose stowage}
    starboard: {desc: hose attachment, adjacent to hose stowage}
  # visible in drawings/eris_profile_view.jpg (hose reel amidships)
  points:
    runState:          {type: bool}
    amps:              {unit: A}
    dischargePressure: {unit: Pa, sensed: false, desc: candidate sensor}

# --- known gaps, to be specified from the vessel (not invented here) ---
# tanks: black/gray water capacities; fuel plumbing topology (wing->day
#   transfer path, polishing loop valve lineup); sender types per tank
# firePump: motor rating; whether discharge pressure gets a sender
# electrical: battery banks, chargers/inverters, shore power, solar
#   (yacht/solar-plan.txt is currently empty)
# navigation: GPS, heading, depth, wind -- standard Signal K, arrives free
#   with any N2K gateway
# bilge: pump states, float switches, cycle counters
# steering/leeboards: the active leeboard system (yacht/leeboard_blueprint_v1)
#   will need position + load channels once built
